<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sang Min Lee — Curriculum Vitae</title>
  <meta name="description" content="Academic CV of Sang Min Lee, built with academic-cv-template (LaTeX / Awesome-CV).">
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    header {
      display: flex; align-items: center; gap: .75rem; flex-wrap: wrap;
      padding: .75rem 1.25rem; border-bottom: 1px solid rgba(128, 128, 128, .3);
    }
    header h1 { font-size: 1rem; font-weight: 600; margin: 0 auto 0 0; }
    header a {
      font-size: .85rem; text-decoration: none; padding: .35rem .7rem; color: inherit;
      border: 1px solid rgba(128, 128, 128, .4); border-radius: 6px;
    }
    header a:hover { border-color: currentColor; }
    .viewer { width: 100%; height: calc(100vh - 57px); border: 0; }
    .fallback { padding: 2rem 1.25rem; }
    .fallback img { max-width: 100%; height: auto; border: 1px solid rgba(128, 128, 128, .3); }
  </style>
</head>
<body>
  <header>
    <h1>Sang Min Lee · Curriculum Vitae</h1>
    <a href="cv.pdf" download>Download PDF</a>
    <a href="https://github.com/concrete-sangminlee/academic-cv-template">View source</a>
  </header>
  <object class="viewer" data="cv.pdf" type="application/pdf">
    <div class="fallback">
      <p>Your browser can't display the embedded PDF — <a href="cv.pdf">open the CV here</a>.</p>
      <img src="preview.png" alt="CV preview (page 1)">
    </div>
  </object>
</body>
</html>
